<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visite Virtuelle 360° Pam Rdc</title>
    <!-- Script et Styles Pannellum via CDN -->
    <link rel="stylesheet" href="https://jsdelivr.net"/>
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <style>
        html, body, #panorama {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    "default": {
        "firstScene": "scene1",
        "author": "Service",
        "autoLoad": true
    },

    "scenes": {
        "scene1": {
            "title": "Extérieur - Entrée 1",
            "hfov": 110,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "images/IMG_20230626_152651_00_106_PureShot.jpg",
            "hotSpots": [
                {
                    "pitch": -5,
                    "yaw": 120,
                    "type": "scene",
                    "text": "Entrer dans le commerce",
                    "sceneId": "scene2"
                }
            ]
        },
        "scene2": {
            "title": "Commerce - Vue 1",
            "hfov": 110,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "images/IMG_20230626_145225_00_076_PureShot.jpg",
            "hotSpots": [
                {
                    "pitch": -2,
                    "yaw": -60,
                    "type": "scene",
                    "text": "Retourner à l'Entrée",
                    "sceneId": "scene1"
                }
            ]
        }
        // Répétez la structure pour vos scènes 3, 4, 5, 6 et 7...
    }
});
</script>

</body>
</html>
